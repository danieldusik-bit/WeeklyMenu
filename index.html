<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Family Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f5f4f0;
        --surface: #ffffff;
        --text: #2c2a28;
        --text-secondary: #6e6b66;
        --primary: #4a6b52;
        --primary-light: #e6efe8;
        --accent: #d87c46;
        --border: #e4e2dd;
        --check: #4a6b52;
        --nav-bg: #ffffff;
        
        --dot-bf: #d87c46;
        --dot-lu: #e6b93d;
        --dot-di: #4a6b52;

        --radius-card: 14px;
        --radius-pill: 999px;
        --tap-size: 44px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #1a1918;
            --surface: #242220;
            --text: #eceae8;
            --text-secondary: #9c9994;
            --primary: #6c9475;
            --primary-light: #2d3830;
            --accent: #e59363;
            --border: #3b3835;
            --check: #6c9475;
            --nav-bg: #242220;
        }
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .serif {
        font-family: 'Playfair Display', serif;
    }

    button {
        font-family: inherit;
        border: none;
        background: none;
        color: inherit;
        cursor: pointer;
    }

    .scrollable {
        -webkit-overflow-scrolling: touch;
    }

    /* Layout */
    .app-container {
        padding-bottom: 80px; /* Space for bottom nav */
    }

    .header {
        padding: 24px 20px 16px;
        position: sticky;
        top: 0;
        background-color: var(--bg);
        z-index: 10;
        border-bottom: 1px solid var(--border);
    }

    .header h1 {
        font-size: 24px;
        margin-bottom: 4px;
    }

    .header p {
        color: var(--text-secondary);
        font-size: 14px;
    }

    .tab-content {
        display: none;
        padding: 16px 20px;
    }
    .tab-content.active {
        display: block;
    }

    /* Menu Plan Tab */
    .day-card {
        background-color: var(--surface);
        border-radius: var(--radius-card);
        margin-bottom: 16px;
        overflow: hidden;
        border: 1px solid var(--border);
    }

    .day-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: var(--tap-size);
        cursor: pointer;
    }

    .day-title {
        font-weight: 600;
        font-size: 16px;
    }

    .day-preview {
        color: var(--text-secondary);
        font-size: 13px;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 250px;
    }

    .day-toggle-icon {
        transition: transform 0.3s ease;
    }
    .day-card.expanded .day-toggle-icon {
        transform: rotate(180deg);
    }

    .meals-list {
        display: none;
        border-top: 1px solid var(--border);
    }
    .day-card.expanded .meals-list {
        display: block;
    }

    .meal-row {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--border);
        min-height: var(--tap-size);
        cursor: pointer;
    }
    .meal-row:last-child {
        border-bottom: none;
    }

    .meal-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 12px;
        flex-shrink: 0;
    }
    .dot-bf { background-color: var(--dot-bf); }
    .dot-lu { background-color: var(--dot-lu); }
    .dot-di { background-color: var(--dot-di); }

    .meal-info {
        flex: 1;
    }

    .meal-type {
        font-size: 12px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
    }

    .meal-name {
        font-size: 15px;
        font-weight: 500;
    }

    .meal-chevron {
        color: var(--text-secondary);
    }

    /* Recipe View */
    #recipe-view {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg);
        z-index: 100;
        overflow-y: auto;
        display: none;
        padding-bottom: 40px;
    }

    .recipe-header {
        padding: 16px 20px;
        display: flex;
        align-items: center;
        position: sticky;
        top: 0;
        background-color: var(--bg);
        border-bottom: 1px solid var(--border);
        z-index: 10;
    }

    .back-btn {
        display: flex;
        align-items: center;
        font-size: 15px;
        font-weight: 500;
        min-height: var(--tap-size);
        color: var(--primary);
    }

    .back-btn svg {
        margin-right: 6px;
    }

    .recipe-content {
        padding: 24px 20px;
    }

    .recipe-tag {
        display: inline-block;
        padding: 6px 12px;
        border-radius: var(--radius-pill);
        background-color: var(--primary-light);
        color: var(--primary);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 16px;
    }

    .recipe-title {
        font-size: 28px;
        line-height: 1.2;
        margin-bottom: 16px;
    }

    .meta-chips {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }

    .chip {
        padding: 6px 14px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
        background-color: var(--surface);
    }

    .recipe-desc {
        font-size: 15px;
        color: var(--text-secondary);
        margin-bottom: 24px;
    }

    .section-title {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .ingredients-card {
        background-color: var(--surface);
        border-radius: var(--radius-card);
        border: 1px solid var(--border);
        padding: 16px;
        margin-bottom: 24px;
    }

    .ingredient-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        font-size: 15px;
    }
    .ingredient-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
    }

    .ingredient-qty {
        font-weight: 600;
        color: var(--text-secondary);
    }

    .method-steps {
        counter-reset: step;
        list-style: none;
        margin-bottom: 24px;
    }

    .method-step {
        position: relative;
        padding-left: 36px;
        margin-bottom: 16px;
        font-size: 15px;
    }

    .method-step::before {
        counter-increment: step;
        content: counter(step);
        position: absolute;
        left: 0;
        top: -2px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background-color: var(--primary);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
    }

    .tip-box {
        background-color: var(--primary-light);
        border-radius: var(--radius-card);
        padding: 16px;
        display: flex;
        gap: 12px;
    }

    .tip-box svg {
        color: var(--primary);
        flex-shrink: 0;
    }

    .tip-content strong {
        display: block;
        color: var(--primary);
        font-size: 14px;
        margin-bottom: 4px;
    }
    
    .tip-content p {
        font-size: 14px;
        color: var(--text);
    }

    /* Shopping List Tab */
    .progress-container {
        margin-bottom: 20px;
    }

    .progress-text {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 8px;
    }

    .progress-bar-bg {
        height: 8px;
        background-color: var(--border);
        border-radius: var(--radius-pill);
        overflow: hidden;
    }

    .progress-bar-fill {
        height: 100%;
        background-color: var(--primary);
        border-radius: var(--radius-pill);
        width: 0%;
        transition: width 0.3s ease;
    }

    .filter-scroll {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 16px;
        margin: 0 -20px 16px;
        padding-left: 20px;
        padding-right: 20px;
        scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar {
        display: none;
    }

    .filter-chip {
        padding: 8px 16px;
        border-radius: var(--radius-pill);
        background-color: var(--surface);
        border: 1px solid var(--border);
        font-size: 14px;
        white-space: nowrap;
        min-height: var(--tap-size);
        display: flex;
        align-items: center;
        transition: all 0.2s;
    }
    .filter-chip.active {
        background-color: var(--text);
        color: var(--bg);
        border-color: var(--text);
    }

    .shop-category {
        margin-bottom: 24px;
    }

    .shop-category-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .shop-item {
        display: flex;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
        min-height: var(--tap-size);
        cursor: pointer;
    }

    .checkbox {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        border: 2px solid var(--border);
        margin-right: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
    }

    .shop-item-info {
        flex: 1;
    }

    .shop-item-name {
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 4px;
        transition: color 0.2s;
    }

    .shop-item-meta {
        font-size: 13px;
        color: var(--text-secondary);
    }

    .shop-item-qty {
        font-weight: 600;
    }

    .shop-item.checked .checkbox {
        background-color: var(--check);
        border-color: var(--check);
    }
    .shop-item.checked .checkbox::after {
        content: '';
        width: 5px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        margin-bottom: 2px;
    }
    .shop-item.checked .shop-item-name {
        text-decoration: line-through;
        color: var(--text-secondary);
        opacity: 0.7;
    }

    .reset-btn {
        width: 100%;
        padding: 14px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        color: var(--text);
        font-size: 15px;
        font-weight: 500;
        margin-top: 16px;
        min-height: var(--tap-size);
    }

    /* Bottom Nav */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: var(--nav-bg);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-around;
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 50;
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px 0;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
        min-height: 60px;
    }

    .nav-item svg {
        margin-bottom: 4px;
        fill: currentColor;
    }

    .nav-item.active {
        color: var(--primary);
    }
</style>
</head>
<body>

<div id="main-view" class="app-container">
    <div class="header">
        <h1 class="serif">Family Planner</h1>
        <p>2 Adults + 2 Kids • Chicken, Beef, Turkey, Salmon & Pasta</p>
    </div>

    <div id="menu-tab" class="tab-content scrollable active">
        <div id="menu-container"></div>
    </div>

    <div id="shopping-tab" class="tab-content scrollable">
        <div class="progress-container">
            <div class="progress-text">
                <span>Items collected</span>
                <span id="progress-count">0 / 0</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="filter-container" class="filter-scroll"></div>
        <div id="shopping-container"></div>
        
        <button class="reset-btn" onclick="resetShop()">Reset List</button>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('menu')" id="nav-menu">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            Menu
        </button>
        <button class="nav-item" onclick="switchTab('shopping')" id="nav-shopping">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Shopping
        </button>
    </nav>
</div>

<div id="recipe-view" class="scrollable">
    <div class="recipe-header">
        <button class="back-btn" onclick="closeRecipe()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </button>
    </div>
    <div id="recipe-content" class="recipe-content"></div>
</div>

<script>
// --- DATA ---
const planData = [
    {

            {

function init() {
    renderMenu();
    renderFilters();
    renderShopping();
}

function switchTab(tab) {
    document.getElementById('menu-tab').classList.remove('active');
    document.getElementById('shopping-tab').classList.remove('active');
    document.getElementById('nav-menu').classList.remove('active');
    document.getElementById('nav-shopping').classList.remove('active');
    
    document.getElementById(tab + '-tab').classList.add('active');
    document.getElementById('nav-' + tab).classList.add('active');
    window.scrollTo(0,0);
}

function renderMenu() {
    const container = document.getElementById('menu-container');
    let html = '';

    planData.forEach((dayObj, dayIdx) => {
        const isExpanded = openDays.includes(dayIdx);
        const previewText = dayObj.meals.map(m => m.name).join(' • ');

        html += `
            <div class="day-card ${isExpanded ? 'expanded' : ''}" id="day-${dayIdx}">
                <div class="day-header" onclick="toggleDay(${dayIdx})">
                    <div>
                        <div class="day-title">${dayObj.day}</div>
                        <div class="day-preview">${previewText}</div>
                    </div>
                    <svg class="day-toggle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div class="meals-list">
                    ${dayObj.meals.map((meal, mealIdx) => `
                        <div class="meal-row" onclick="openRecipe(${dayIdx}, ${mealIdx})">
                            <div class="meal-dot ${meal.dot}"></div>
                            <div class="meal-info">
                                <div class="meal-type">${meal.type}</div>
                                <div class="meal-name">${meal.name}</div>
                            </div>
                            <svg class="meal-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

function toggleDay(dayIdx) {
    const card = document.getElementById(`day-${dayIdx}`);
    const index = openDays.indexOf(dayIdx);
    if (index > -1) {
        openDays.splice(index, 1);
        card.classList.remove('expanded');
    } else {
        openDays.push(dayIdx);
        card.classList.add('expanded');
    }
}

                    <span class="ingredient-qty">${ing.qty}</span>
                </div>
            `).join('')}
        </div>

        <h3 class="section-title serif">Method</h3>
        <ol class="method-steps">
            ${meal.method.map(step => `
                <li class="method-step">${step}</li>
            `).join('')}
        </ol>

        <div class="tip-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <div class="tip-content">
                <strong>Chef's Tip</strong>
                <p>${meal.tip}</p>
            </div>
        </div>
    `;

    container.innerHTML = html;
    document.getElementById('recipe-view').style.display = 'block';
    document.body.style.overflow = 'hidden'; // Prevent background scrolling
}

function closeRecipe() {
    document.getElementById('recipe-view').style.display = 'none';
    document.body.style.overflow = '';
}

function renderFilters() {
    const container = document.getElementById('filter-container');
    container.innerHTML = categories.map(cat => `
        <button class="filter-chip ${shopFilter === cat ? 'active' : ''}" onclick="setFilter('${cat}')">${cat}</button>
    `).join('');
}

function setFilter(cat) {
    shopFilter = cat;
    renderFilters();
    renderShopping();
}

function renderShopping() {
    const container = document.getElementById('shopping-container');
    let html = '';

    const filteredCategories = shopFilter === "All" ? categories.slice(1) : [shopFilter];
    
    let totalItems = 0;
    let totalChecked = 0;

    filteredCategories.forEach(cat => {
        const items = shoppingItems.filter(item => item.cat === cat);
        if (items.length === 0) return;

        html += `
            <div class="shop-category">
                <div class="shop-category-title">${cat}</div>
        `;

        items.forEach(item => {
            const isChecked = checkedItems.includes(item.id);
            totalItems++;
            if (isChecked) totalChecked++;

            html += `
                <div class="shop-item ${isChecked ? 'checked' : ''}" onclick="toggleItem(${item.id})">
                    <div class="checkbox"></div>
                    <div class="shop-item-info">
                        <div class="shop-item-name">${item.name} <span class="shop-item-qty">· ${item.qty}</span></div>
                        <div class="shop-item-meta">${item.meals.join(', ')}</div>
                    </div>
                </div>
            `;
        });

        html += `</div>`;
    });

    container.innerHTML = html;

    // Update progress only if "All" is selected to show accurate total progress
    if (shopFilter === "All") {
        document.getElementById('progress-count').textContent = `${totalChecked} / ${totalItems}`;
        const pct = totalItems === 0 ? 0 : (totalChecked / totalItems) * 100;
        document.getElementById('progress-bar').style.width = `${pct}%`;
    }
}

function toggleItem(id) {
    const index = checkedItems.indexOf(id);
    if (index > -1) {
        checkedItems.splice(index, 1);
    } else {
        checkedItems.push(id);
    }
    renderShopping();
}

function resetShop() {
    if (confirm("Clear all checked items?")) {
        checkedItems = [];
        renderShopping();
    }
}

// Init
window.onload = init;

</script>
</body>
</html>
